version: "2"

linters:
  enable:
    - depguard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      # Dependency direction: adapter → usecase → domain (docs/adr/codebase/0001); adapters apart
      # from one another (docs/adr/codebase/0005).
      rules:
        domain:
          list-mode: strict
          files: ["**/internal/domain/**"]
          allow:
            - "$gostd"
            - github.com/Yusaku-KASAI/agent-control-plane/internal/domain
        usecase:
          list-mode: strict
          files: ["**/internal/usecase/**"]
          allow:
            - "$gostd"
            - github.com/Yusaku-KASAI/agent-control-plane/internal/domain
            - github.com/Yusaku-KASAI/agent-control-plane/internal/usecase
        adapter:
          files: ["**/internal/adapter/**"]
          deny:
            - pkg: github.com/Yusaku-KASAI/agent-control-plane/cmd
              desc: adapters must not depend on the composition root
        # Test files are left out: a package's external tests import the package itself.
        adapter-siblings:
          files: ["**/internal/adapter/**", "!$test"]
          deny:
            - pkg: github.com/Yusaku-KASAI/agent-control-plane/internal/adapter
              desc: an adapter is one package and depends on no other; cmd/acp joins them

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Yusaku-KASAI/agent-control-plane
