set -g mouse on
set -g history-limit 50000
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
setw -g mode-keys vi

# Copy mode behaves like a plain terminal selection: the mouse only selects and keeps the selection
# (a stray click never overwrites the clipboard), y, Enter or C-c copies it (C-c as in Claude Code's
# fullscreen view), and Escape or a click leaves it.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line }
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi C-c send -X copy-pipe-and-cancel

# Bells from panes reach the outer terminal and also show in tmux.
set -g bell-action any
set -g visual-bell both
