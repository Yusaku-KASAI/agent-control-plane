# Names and paths come from .devcontainer/.env, written by init-host.sh, so that only the parts a
# target fills in (the build target and the toolchain's cache volumes) differ between targets.
name: ${REPO_NAME:?run .devcontainer/init-host.sh}-dev

services:
  dev-container:
    build:
      context: ..
      dockerfile: ./.devcontainer/Dockerfile
      target: go
      args:
        TZ: ${TZ:-UTC}
        HOST_UID: ${HOST_UID:?run .devcontainer/init-host.sh}
        HOST_GID: ${HOST_GID:?run .devcontainer/init-host.sh}
    # A fixed name, so that the control plane's config can run agents from this image
    # (agents[].target.image).
    image: ${REPO_NAME}-devcontainer
    working_dir: /workspace/${REPO_NAME}
    volumes:
      # Docker mounts parents first, so the repo mount below overlays this read-only one.
      - ../..:/workspace:ro
      - ..:/workspace/${REPO_NAME}:cached
      # On the host, outside Docker, so that no prune or `down -v` removes logins and history.
      - ${DEV_STATE_DIR:?run .devcontainer/init-host.sh}/claude:/home/node/.claude
      - ${DEV_STATE_DIR}/gh:/home/node/.config/gh
      - ${DEV_STATE_DIR}/history:/commandhistory
      # A volume, so that VS Code's server, its extensions and chat history survive container rebuilds.
      - vscode-server:/home/node/.vscode-server
      # Caches only: losing them costs a download.
      - go-mod:/home/node/go/pkg/mod
      - go-build:/home/node/.cache/go-build
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - POWERLEVEL9K_DISABLE_GITSTATUS=true
      - PROMPT_COMMAND=history -a
      - HISTFILE=/commandhistory/.bash_history
      # Reaches the control plane as the target contract specifies. The API token is deliberately
      # not passed: it would let this container start agents that hold GitHub credentials.
      - ACP_SERVER=http://control-plane:8787

volumes:
  vscode-server:
  go-mod:
  go-build:

networks:
  # The control plane's network, per the target contract; init-host.sh creates it.
  default:
    name: agent-control-plane-net
    external: true
