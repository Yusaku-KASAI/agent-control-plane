set -g mouse on
set -g history-limit 50000
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
setw -g mode-keys vi

# Selecting with the mouse (drag, double or triple click) only selects and keeps the selection, so a
# stray click never overwrites the clipboard. y or Enter copies it; q or Escape leaves copy mode.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line }
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

# Bells from panes (such as Claude Code's, see docs/target/README.md) reach the outer terminal and
# also show in tmux.
set -g bell-action any
set -g visual-bell both
