# Devcontainer tmux defaults. Loaded as /home/node/.tmux.conf (see Dockerfile).
# Keep this minimal — project-agnostic ergonomics only; per-project tweaks belong
# in a fork's own overrides.

# Mouse: scroll, select panes/windows, resize by drag.
set -g mouse on

# Generous scrollback so long test/build output stays reachable.
set -g history-limit 50000

# Run panes under zsh (powerlevel10k) instead of the login sh.
set -g default-shell /bin/zsh

# 256-color / truecolor so p10k and editors render correctly.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 1-based, gapless window numbering (matches the keyboard layout).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# No escape-key lag (important for vim/nano inside tmux).
set -sg escape-time 0

# vi-style copy mode.
setw -g mode-keys vi

# 内部のベル信号を、外（VS Codeのターミナル）へそのまま通過させる設定
set -g bell-action any
set -g visual-bell off
