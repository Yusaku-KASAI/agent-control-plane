# Control plane config. Copy to acp.yaml in this directory (gitignored) and set ACP_CONFIG in .env to its
# host path.
#
# Paths are host paths: the control plane container mounts them at the same place.
#   /home/you/projects/...     under ACP_HOST_ROOT  (targets, sessions, usage log)
#   /home/you/acp-secrets/...  under ACP_SECRETS_DIR (tokens and keys)
# Where these directories may be is in .env.example.
# Paths under /var/lib/acp/ are inside the control plane container and match compose.yaml.

sessions:
  # Where each session's workspace and record live. Must be outside every target repository.
  root: /home/you/projects/acp-sessions
  # Close an agent's container after this long with no turn, queued prompt or background task.
  # Default: 15m.
  idle_timeout: 15m
  # Remove a session unused for this long, unless it has a reason to be kept, and tell its thread.
  # What is removed and what keeps a session: docs/architecture/app/sessions.md#cleaner.
  # Default: 720h (30 days).
  retention: 720h

# Short-lived credentials handed to agent containers, per session. Agent containers mount their
# session's subpath of the volume; with volume empty, dir is a host path and is bind-mounted.
credentials:
  dir: /var/lib/acp/credentials
  volume: acp-credentials

# The control plane's own binary, which it puts here on start for the containers it starts to run,
# such as the one reading a session's workspace for the cleanup. They mount the volume read-only;
# with volume empty, dir is a host path and is bind-mounted.
tools:
  dir: /var/lib/acp/tools
  volume: acp-tools

# File where what each turn spent is appended, one line of JSON per turn. Kept apart from sessions so
# that it outlives them. What a line holds: docs/architecture/app/sessions.md#usage.
usage_log: /home/you/projects/acp-usage.jsonl

# State only the control plane reads and writes, such as rotating Slack tokens. Matches the acp-state
# volume in compose.yaml.
state_dir: /var/lib/acp/state

claude:
  # How agents authenticate Claude Code: a token from `claude setup-token` (oauth_token_path)
  # or an API key (api_key_path). Exactly one.
  oauth_token_path: /home/you/acp-secrets/claude-oauth-token
  # Each agent's Claude Code config directory (conversation history, auto memory). Agent containers
  # mount the agent's subpath of config_volume; with config_volume empty, config_dir is a host path
  # and is bind-mounted.
  config_dir: /var/lib/acp/claude
  config_volume: acp-claude

# People credited as Co-authored-by in the commits made for their requests. Optional.
people:
  - slack: U0123456789 # Slack member ID
    git_name: Your Name
    git_email: 1234567+you@users.noreply.github.com # your GitHub noreply address

agents:
  # Makes changes and delivers them as pull requests; also reviews.
  - name: control-plane-dev
    role: developer # a Claude Code agent from platform/plugins/roles, or the target's .claude/agents/
    target:
      path: /home/you/projects/agent-control-plane # the repository the agent works on
      image: agent-control-plane-devcontainer # built from the target's devcontainer
    # Author of the agent's commits: the GitHub App's bot user. The number is the bot user's account
    # id (gh api '/users/<app-slug>[bot]' --jq .id), not the App ID.
    git:
      author_name: control-plane-dev-agent[bot]
      author_email: 7654321+control-plane-dev-agent[bot]@users.noreply.github.com
    # The agent's own GitHub App, installed on the target repository with webhooks off. Optional;
    # without it the agent cannot push and its branches start from the target's local HEAD.
    # Permissions for a developer: Contents, Pull requests and Issues read and write; Actions, Checks
    # and Commit statuses read-only (to read the pull request's CI results and logs).
    github:
      app_id: 123456
      installation_id: 12345678
      private_key_path: /home/you/acp-secrets/control-plane-dev.private-key.pem
    # The agent's own Slack app. Optional; without it the agent is reached only through `acp run`.
    slack:
      app_token_path: /home/you/acp-secrets/control-plane-dev.slack-app-token # xapp-, for Socket Mode
      # Without rotation: the bot token in use. With rotation: a long-lived token exchanged once at
      # first start; when there is none, get the first tokens with `acp slack-auth` instead.
      bot_token_path: /home/you/acp-secrets/control-plane-dev.slack-bot-token
      allowed_users: [U0123456789] # Slack member IDs who may make requests and stop sessions
      # Only when token rotation is enabled on the Slack app.
      rotation:
        client_id: "1234567890.1234567890"
        client_secret_path: /home/you/acp-secrets/control-plane-dev.slack-client-secret

  # Answers questions about the target without changing it.
  - name: control-plane-guide
    role: guide
    target:
      path: /home/you/projects/agent-control-plane
      image: agent-control-plane-devcontainer
    # Permissions for a guide: Contents, Pull requests and Issues read-only, so it reads the remote
    # but cannot push.
    github:
      app_id: 234567
      installation_id: 23456789
      private_key_path: /home/you/acp-secrets/control-plane-guide.private-key.pem
    slack:
      app_token_path: /home/you/acp-secrets/control-plane-guide.slack-app-token
      bot_token_path: /home/you/acp-secrets/control-plane-guide.slack-bot-token
      allowed_users: [U0123456789]
      rotation:
        client_id: "2345678901.2345678901"
        client_secret_path: /home/you/acp-secrets/control-plane-guide.slack-client-secret

  # Reviews pull requests and the whole repository without changing them; leaves pull request reviews
  # (comments only) and issues.
  - name: control-plane-reviewer
    role: reviewer
    target:
      path: /home/you/projects/agent-control-plane
      image: agent-control-plane-devcontainer
    # Permissions for a reviewer: Contents read-only; Pull requests and Issues read and write (to leave
    # reviews and file reports); Actions, Checks and Commit statuses read-only (to read CI results).
    github:
      app_id: 345678
      installation_id: 34567890
      private_key_path: /home/you/acp-secrets/control-plane-reviewer.private-key.pem
    # Optional, as for any agent; without it the reviewer is asked through `acp run`.
    slack:
      app_token_path: /home/you/acp-secrets/control-plane-reviewer.slack-app-token
      bot_token_path: /home/you/acp-secrets/control-plane-reviewer.slack-bot-token
      allowed_users: [U0123456789]

  # Tidies issues and the roadmap and talks ideas through, keeping them in issues; changes no files.
  - name: control-plane-pm
    role: pm
    target:
      path: /home/you/projects/agent-control-plane
      image: agent-control-plane-devcontainer
    # Permissions for a pm: Contents and Pull requests read-only; Issues read and write (to tidy issues
    # and keep ideas in them). Issues write also reaches pull request comments and labels; the role's
    # instructions keep the pm off pull requests.
    github:
      app_id: 456789
      installation_id: 45678901
      private_key_path: /home/you/acp-secrets/control-plane-pm.private-key.pem
    slack:
      app_token_path: /home/you/acp-secrets/control-plane-pm.slack-app-token
      bot_token_path: /home/you/acp-secrets/control-plane-pm.slack-bot-token
      allowed_users: [U0123456789]
