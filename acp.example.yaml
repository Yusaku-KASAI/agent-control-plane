sessions:
  root: /absolute/path/on/host/to/acp-sessions
claude:
  config_volume: agent-control-plane_claude-code-config
agents:
  - name: control-plane-dev
    role: developer
    target:
      path: /absolute/path/on/host/to/agent-control-plane
      image: agent-control-plane-dev-dev-container
    git:
      author_name: control-plane-dev (agent)
      author_email: <id>+<user>@users.noreply.github.com
    github:
      app_id: 123456
      installation_id: 12345678
      private_key_path: /absolute/path/on/host/to/control-plane-dev.private-key.pem
