sessions:
  root: /absolute/path/on/host/to/acp-sessions
  idle_timeout: 15m
# Matches compose.yaml. When running `acp serve` on the host, use a host directory and omit volume.
credentials:
  dir: /var/lib/acp/credentials
  volume: acp-credentials
state_dir: /var/lib/acp/state
claude:
  config_volume: agent-control-plane_claude-code-config
# Requesters credited as Co-authored-by in the agents' commits.
people:
  - slack: U0123456789
    git_name: Your Name
    git_email: <id>+<user>@users.noreply.github.com
agents:
  - name: control-plane-dev
    role: developer
    target:
      path: /absolute/path/on/host/to/agent-control-plane
      image: agent-control-plane-dev-dev-container
    # The GitHub App's bot user, so that its commits show as the app. The id is the bot user's
    # account id (gh api '/users/<app-slug>[bot]' --jq .id), not the App ID.
    git:
      author_name: <app-slug>[bot]
      author_email: <bot-user-id>+<app-slug>[bot]@users.noreply.github.com
    github:
      app_id: 123456
      installation_id: 12345678
      private_key_path: /absolute/path/on/host/to/control-plane-dev.private-key.pem
    slack:
      app_token_path: /absolute/path/on/host/to/acp-secrets/control-plane-dev.slack-app-token
      bot_token_path: /absolute/path/on/host/to/acp-secrets/control-plane-dev.slack-bot-token
      allowed_users: [U0123456789]
      # With token rotation enabled on the Slack app; bot_token_path is then exchanged once.
      rotation:
        client_id: "1234567890.1234567890"
        client_secret_path: /absolute/path/on/host/to/acp-secrets/control-plane-dev.slack-client-secret
