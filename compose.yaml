name: agent-control-plane

services:
  control-plane:
    build: .
    restart: unless-stopped
    # Long enough for agents to wind down and threads to be told (StopTimeout in cmd/acp/serve.go).
    stop_grace_period: 1m
    user: "${ACP_UID:-1000}:${ACP_GID:-1000}"
    environment:
      ACP_API_TOKEN: ${ACP_API_TOKEN:?set ACP_API_TOKEN in .env}
      DOCKER_HOST: tcp://docker-proxy:2375
      HOME: /tmp
    volumes:
      - ${ACP_CONFIG:?set ACP_CONFIG in .env}:/etc/acp/acp.yaml:ro
      # Same paths as on the host (docs/architecture/app/containers.md).
      - ${ACP_HOST_ROOT:?set ACP_HOST_ROOT in .env}:${ACP_HOST_ROOT}
      - ${ACP_SECRETS_DIR:?set ACP_SECRETS_DIR in .env}:${ACP_SECRETS_DIR}:ro
      # Short-lived per-session credentials (docs/adr/app/0018). Agent containers mount their
      # session's subpath of this volume by name, so the name is fixed.
      - acp-credentials:/var/lib/acp/credentials
      # Each agent's Claude Code config directory (history, auto memory), apart from the dev container's.
      - acp-claude:/var/lib/acp/claude
      # State only the control plane reads and writes (state_dir in acp.yaml), such as rotating Slack tokens.
      - acp-state:/var/lib/acp/state
      # The control plane's own binary, put here on start for the containers that read workspaces.
      # They mount this volume by name, so the name is fixed.
      - acp-tools:/var/lib/acp/tools
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - default
      - docker-proxy
    depends_on:
      - docker-proxy

  # The only holder of the Docker socket. It passes just the container calls the runner makes
  # (docs/adr/app/0015).
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    user: "65534:${DOCKER_SOCKET_GID:-0}"
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64M
    command:
      - -listenip=0.0.0.0
      - -allowfrom=control-plane
      # One entry per API, so the test in internal/adapter/docker/proxy_test.go can tell that each is used.
      # The client pings with HEAD and falls back to GET.
      - -allowHEAD=^/_ping$
      - -allowGET=^/_ping$
      - -allowGET=^/(v[0-9.]+/)?containers/json$
      - -allowPOST=^/(v[0-9.]+/)?containers/create$
      - -allowPOST=^/(v[0-9.]+/)?containers/[a-zA-Z0-9_.-]+/attach$
      - -allowPOST=^/(v[0-9.]+/)?containers/[a-zA-Z0-9_.-]+/start$
      - -allowPOST=^/(v[0-9.]+/)?containers/[a-zA-Z0-9_.-]+/wait$
      - -allowDELETE=^/(v[0-9.]+/)?containers/[a-zA-Z0-9_.-]+$
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

volumes:
  acp-credentials:
    name: acp-credentials
  acp-claude:
    name: acp-claude
  acp-state:
    name: acp-state
  acp-tools:
    name: acp-tools

networks:
  docker-proxy:
    internal: true
