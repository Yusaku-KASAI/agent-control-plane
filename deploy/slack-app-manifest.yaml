# Slack app for one agent. Create one app per agent from this manifest and rename it.
display_information:
  name: control-plane-dev
features:
  bot_user:
    display_name: control-plane-dev
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
