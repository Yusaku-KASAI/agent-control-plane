# Slack app for one agent. Create one app per agent from this manifest (Create New App > From a manifest),
# replacing control-plane-dev with the agent's name.
display_information:
  name: control-plane-dev
features:
  bot_user:
    display_name: control-plane-dev
    always_online: true
oauth_config:
  # Needed only for token rotation. The control plane never serves it, so any https URL works: after
  # authorizing, copy the code from the address bar into `acp slack-auth`.
  redirect_urls:
    - https://localhost/slack/oauth/callback
  scopes:
    bot:
      - app_mentions:read # receive mentions
      - channels:history # read threads, in the control plane and the agent
      - groups:history
      - chat:write # replies and status messages
      - reactions:read # stop and clean reactions
      - reactions:write # acknowledgement reactions
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - reaction_added
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  # Bot tokens expire in 12 hours and the control plane refreshes them (slack.rotation in acp.yaml).
  # Cannot be turned off once on; set false to use a non-expiring bot token instead.
  token_rotation_enabled: true
