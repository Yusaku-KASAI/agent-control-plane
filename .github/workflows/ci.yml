name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so that new vulnerabilities are found even while the Go files stay unchanged.
  schedule:
    - cron: "0 0 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: make check
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: check
          outputs: type=cacheonly
          no-cache-filters: ${{ github.event_name == 'schedule' && 'check-go' || '' }}
          cache-from: type=gha,scope=dev-container
          cache-to: type=gha,scope=dev-container,mode=max

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,scope=control-plane,mode=max
