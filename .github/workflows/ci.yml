name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so that new vulnerabilities are found even while the Go files stay unchanged.
  schedule:
    - cron: "0 0 * * 1"

jobs:
  check-concern:
    name: check-${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: go, file: .devcontainer/Dockerfile, target: check-go }
          - { check: platform, file: .devcontainer/Dockerfile, target: check-platform }
          - { check: target, file: .devcontainer/Dockerfile, target: check-target }
          # The control plane's own image builds.
          - { check: image, file: Dockerfile, target: "" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target || matrix.file }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          outputs: type=cacheonly
          no-cache-filters: ${{ github.event_name == 'schedule' && matrix.check == 'go' && 'check-go' || '' }}
          # One scope per job: jobs writing the same scope would overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.check }}
          cache-to: type=gha,scope=${{ matrix.check }},mode=max

  # The conventions plugin's action, at this branch's version, as targets use it at main. It needs
  # no target toolchain, so it runs outside the devcontainer image.
  check-docs:
    runs-on: ubuntu-latest
    # It runs code from the platform; reading is all it needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./platform/plugins/conventions/actions/check-docs

  # The github plugin's action, as check-docs is. It reads the repository's settings and CODEOWNERS
  # through the API, so it also fails when the protection is lost outside any pull request (as on the
  # weekly run).
  check-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Only for the action's own path; the action itself reads GitHub, not the checkout.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./platform/plugins/github/actions/check-protection

  # The one required status check. A job skipped because a need failed would count as passed, so
  # this one always runs and fails on its own.
  check:
    needs: [check-concern, check-docs, check-protection]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.check-concern.result }}" = success
          test "${{ needs.check-docs.result }}" = success
          test "${{ needs.check-protection.result }}" = success
