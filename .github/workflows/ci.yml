name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so that new vulnerabilities are found even while the Go files stay unchanged.
  schedule:
    - cron: "0 0 * * 1"

jobs:
  check-concern:
    name: check-${{ matrix.concern }}
    strategy:
      fail-fast: false
      matrix:
        concern: [go, platform, target]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: make check-${{ matrix.concern }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: check-${{ matrix.concern }}
          outputs: type=cacheonly
          no-cache-filters: ${{ github.event_name == 'schedule' && matrix.concern == 'go' && 'check-go' || '' }}
          # One scope per job: jobs writing the same scope would overwrite each other's cache.
          cache-from: type=gha,scope=dev-container-${{ matrix.concern }}
          cache-to: type=gha,scope=dev-container-${{ matrix.concern }},mode=max

  # The required status check. A job skipped because a need failed would count as passed, so this
  # one always runs and fails on its own.
  check:
    needs: check-concern
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check-concern.result }}" = success

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,scope=control-plane,mode=max
